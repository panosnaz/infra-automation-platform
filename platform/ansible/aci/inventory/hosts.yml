---
all:
  children:
    aci:
      hosts:
        apic:
          # cisco.aci modules connect over the APIC REST API, not SSH —
          # ansible_connection: local means no SSH transport is used.
          # See group_vars/aci.yml for connection variables (host, username,
          # password, validate_certs), sourced from Vault at runtime — never
          # hardcoded here.
          ansible_connection: local
          ansible_python_interpreter: "{{ ansible_playbook_python }}"
