---
all:
  children:
    evpn:
      hosts:
        # ADR-021 §18: real Nexus 9000v hardware confirmed live this
        # session -- httpapi/NX-API, not network_cli/SSH, matching every
        # other real connection to these devices in this ADR (Terraform's
        # nxos provider, pyATS's direct NX-API calls). All values default
        # to DC1-Leaf so a plain `ansible-playbook` run (no -e overrides)
        # targets a real, working device instead of a placeholder.
        dc1-leaf:
          ansible_host: "{{ nxos_host | default('172.30.46.220') }}"
          ansible_connection: ansible.netcommon.httpapi
          ansible_network_os: cisco.nxos.nxos
          ansible_httpapi_use_ssl: true
          ansible_httpapi_validate_certs: false
          ansible_user: "{{ nxos_username | default('admin') }}"
          ansible_password: "{{ nxos_password | default('cisco') }}"
          ansible_python_interpreter: "{{ ansible_playbook_python }}"
