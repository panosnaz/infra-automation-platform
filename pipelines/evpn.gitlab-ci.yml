# VXLAN EVPN domain pipeline (ADR-021). Extends the same shared stage
# templates in includes/common.gitlab-ci.yml that pipelines/aci.gitlab-ci.yml
# uses for generate/validate/policy -- per ADR-021's whole point, no pipeline
# logic changes for a new domain, only new variables. terraform_plan/
# terraform_apply are the one deliberate exception (see below).
#
# STILL NOT included from the root .gitlab-ci.yml. terraform_plan/
# terraform_apply now relay the real Terraform module through the CML jump
# host (pipelines/scripts/cml-terraform-run.sh, ADR-021 §17) and are
# live-verified (a real `terraform plan` succeeded against DC1-Leaf,
# `Plan: 9 to add`). But ansible_configure/pyats_verify below are still the
# unmodified shared templates -- they run directly in the runner, which
# still has no network path to the devices, and will still fail. Relaying
# those too (same jump-host pattern, or a pyATS-specific variant) is real,
# separate follow-on work, not done in this pass. Do not include this file
# from the root pipeline until that's done.

include:
  - local: "pipelines/includes/common.gitlab-ci.yml"

variables:
  NETASCODE_YAML: "platform/netascode/evpn/fabric.yaml"
  POLICY_DOMAIN: "vxlan_evpn"
  TERRAFORM_DIR: "platform/terraform/evpn"
  ANSIBLE_DIR: "platform/ansible/evpn"
  PYATS_DIR: "tests/pyats/evpn"
  TERRAFORM_VERSION: "1.9.8"
  KNOWLEDGE_CAPTURE_PATH: "knowledge_capture/evpn-deployments.jsonl"
  CI_ENVIRONMENT_NAME: "lab"
  NAUTOBOT_URL: "http://localhost:8080"
  MINIO_ENDPOINT: "http://localhost:9000"
  MINIO_KNOWLEDGE_BUCKET: "knowledge-capture"
  MINIO_KNOWLEDGE_KEY: "evpn/deployments.jsonl"

generate_nac:
  extends: ".generate_nac"

validate_nac:
  extends: ".validate_nac"
  needs: ["generate_nac"]

policy_check:
  extends: ".policy_check"
  needs: ["validate_nac"]

# EVPN-specific, not part of the shared stage templates (ADR-021 §12): the
# real Nexus 9000v lab devices (172.30.46.220-223) are only reachable from
# inside CML's own network, not from this pipeline's runner (confirmed --
# Bridge-mode external connectivity from outside CML is broken, root cause
# unresolved). This job relays a reachability check to all 4 devices via
# the CML jump host (pipelines/scripts/cml-jump-relay.sh) as a real
# pre-flight gate before terraform_plan attempts to reach them directly
# (which will otherwise simply hang/fail with a much less clear error).
evpn_lab_connectivity_check:
  stage: plan
  image: "python:3.12-slim"
  before_script:
    - apt-get update -qq && apt-get install -y -qq curl expect sshpass openssh-client >/dev/null
  script:
    - |
      for ip in 172.30.46.220 172.30.46.221 172.30.46.222 172.30.46.223; do
        echo "Checking NX-API reachability for ${ip} via jump host..."
        pipelines/scripts/cml-jump-relay.sh VXLAN-EVPN-MultiSite jump-host \
          "wget -q -O /dev/null -S --no-check-certificate --timeout=8 https://${ip}/ins 2>&1 | grep -q '401 Unauthorized'" 30
      done
  needs: ["policy_check"]

# EVPN-specific, not the shared .terraform_plan/.terraform_apply templates
# (ADR-021 §17): those run terraform directly in the runner, which has no
# network path to the real devices at all. These relay the whole bundle +
# init + plan/apply through the CML jump host instead, via
# cml-terraform-run.sh -- the file-transfer extension ADR-021 §14 concluded
# was blocked (it wasn't; §17 found the real fix). EVPN_TARGET_DEVICE picks
# which of the 4 real nodes this runs against, since the module manages one
# device per provider block; defaults to dc1_leaf in
# load-vault-evpn-tf-creds.sh.
terraform_plan:
  stage: plan
  image: "python:3.12-slim"
  before_script:
    - apt-get update -qq && apt-get install -y -qq curl expect sshpass openssh-client python3 >/dev/null
    - . pipelines/scripts/load-vault-evpn-tf-creds.sh
  script:
    - pipelines/scripts/cml-terraform-run.sh "VXLAN-EVPN-MultiSite" "jump-host" "." "${TERRAFORM_DIR}" "plan"
  needs: ["evpn_lab_connectivity_check"]

terraform_apply:
  stage: apply
  image: "python:3.12-slim"
  before_script:
    - apt-get update -qq && apt-get install -y -qq curl expect sshpass openssh-client python3 >/dev/null
    - . pipelines/scripts/load-vault-evpn-tf-creds.sh
  script:
    - pipelines/scripts/cml-terraform-run.sh "VXLAN-EVPN-MultiSite" "jump-host" "." "${TERRAFORM_DIR}" "apply"
  needs: ["terraform_plan"]
  environment:
    name: "lab"
  # Same Stage 4 Approval gate as the shared .terraform_apply template
  # (Execution-Framework.md §2.4) -- not inherited via `extends` here since
  # this job no longer extends that template, so it's repeated explicitly.
  when: manual
  allow_failure: false

ansible_configure:
  extends: ".ansible_configure"
  needs: ["terraform_apply"]

pyats_verify:
  extends: ".pyats_verify"
  needs: ["ansible_configure"]

write_results:
  extends: ".write_results"
  needs:
    - job: "generate_nac"
    - job: "pyats_verify"
      optional: true

knowledge_capture:
  extends: ".knowledge_capture"
  needs:
    - job: "generate_nac"
    - job: "pyats_verify"
      optional: true
    - job: "write_results"
      optional: true
