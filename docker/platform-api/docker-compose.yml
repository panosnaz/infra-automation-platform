---
services:
  opa:
    labels:
      com.unisystems.lab.name: "infra-automation-lab"
      com.unisystems.lab.scope: "nautobot-infra-automation"
      com.unisystems.lab.role: "opa"
    image: "openpolicyagent/opa:latest"
    container_name: "infra-automation-lab-opa"
    command: ["run", "--server", "--addr=0.0.0.0:8181", "/policy"]
    ports:
      # Published so GitLab CI jobs (docker executor, network_mode=host per
      # docker/other-containers/gitlab-runner/) can reach OPA directly at
      # localhost:8181 for the Execution Framework's Policy stage.
      - "8181:8181"
    volumes:
      - "./policy:/policy:ro"
    # No healthcheck: the official OPA image has no shell, wget, or curl to
    # run one with (confirmed by inspection, 2026-07-06). Any dependent
    # service must fail closed on an unready OPA rather than relying on a
    # depends_on health gate here.
    restart: unless-stopped
