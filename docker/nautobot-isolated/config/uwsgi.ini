[uwsgi]
; The IP address and port that the WSGI process listens on.
; HTTP only — this is a local lab. The https line is intentionally absent
; because the base image's uWSGI build does not include the SSL plugin, and
; strict = true causes uWSGI to abort on any unknown directive.
http = 0.0.0.0:8080

; Fail to start if any parameter in the configuration file isn't explicitly
; understood by uWSGI (safe now that the ssl-only directive is removed).
strict = true

; Enable master process to gracefully re-spawn and pre-fork workers
master = true

; Allow Python app-generated threads to run
enable-threads = true

; Try to remove all of the generated file/sockets during shutdown
vacuum = true

; Do not use multiple interpreters, allowing only Nautobot to run
single-interpreter = true

; Shutdown when receiving SIGTERM (default is respawn)
die-on-term = true

; Prevents uWSGI from starting if it is unable to load Nautobot
need-app = true

; Reduce noisy uWSGI access logs; 4xx/5xx are still logged
disable-logging = true
log-4xx = true
log-5xx = true

; Enable HTTP 1.1 keepalive support
http-keepalive = 1

; Number of uWSGI workers to spawn (reduced for a lightweight laptop profile)
processes = 2

; Socket listen queue size
listen = 128

; Buffer size for large query parameters (GraphQL, Relationships, etc.)
buffer-size = 4096
