---
services:
  gitlab-runner:
    labels:
      com.unisystems.lab.name: "infra-automation-lab"
      com.unisystems.lab.scope: "nautobot-infra-automation"
      com.unisystems.lab.role: "gitlab-runner"
    image: "gitlab/gitlab-runner:latest"
    container_name: "infra-automation-lab-gitlab-runner"
    volumes:
      - "gitlab_runner_config:/etc/gitlab-runner"
      - "/var/run/docker.sock:/var/run/docker.sock"
    extra_hosts:
      - "host.docker.internal:host-gateway"
    restart: unless-stopped
    networks:
      - app-net

networks:
  app-net:
    external: true
    name: "infra-automation-lab_app-net"

volumes:
  # 2026-07-28: renamed from the generic "config" key -- it collided with
  # gitlab/docker-compose.yml's own "config" key once both files were merged
  # under docker/docker-compose.yml's `include:`, causing this container to
  # be mounted onto GitLab's own /etc/gitlab config volume instead of its own
  # runner config volume. See the matching note in gitlab/docker-compose.yml.
  gitlab_runner_config:
    name: "infra-automation-lab_gitlab_runner_config"
