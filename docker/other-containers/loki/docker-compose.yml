---
services:
  loki:
    labels:
      com.unisystems.lab.name: "infra-automation-lab"
      com.unisystems.lab.scope: "nautobot-infra-automation"
      com.unisystems.lab.role: "loki"
    image: "grafana/loki:latest"
    container_name: "infra-automation-lab-loki"
    ports:
      - "3100:3100"
    command: ["-config.file=/etc/loki/loki-config.yml"]
    volumes:
      - "./loki-config.yml:/etc/loki/loki-config.yml:ro"
      - "loki_data:/loki"
    # No healthcheck: the grafana/loki image is a minimal, shell-less image
    # with no wget/curl available (same situation as the existing OPA
    # container in docker/platform-api/docker-compose.yml).
    restart: unless-stopped
    networks:
      - obs-net

  promtail:
    labels:
      com.unisystems.lab.name: "infra-automation-lab"
      com.unisystems.lab.scope: "nautobot-infra-automation"
      com.unisystems.lab.role: "promtail"
    image: "grafana/promtail:latest"
    container_name: "infra-automation-lab-promtail"
    command: ["-config.file=/etc/promtail/promtail-config.yml"]
    volumes:
      - "./promtail-config.yml:/etc/promtail/promtail-config.yml:ro"
      # Read-only Docker socket access for container discovery (name, labels)
      # via docker_sd_configs -- Promtail never starts/stops/inspects beyond
      # this read-only discovery use.
      - "/var/run/docker.sock:/var/run/docker.sock:ro"
      # The actual log files Docker writes per-container -- discovery alone
      # only gives metadata, this is what Promtail actually tails.
      - "/var/lib/docker/containers:/var/lib/docker/containers:ro"
    depends_on:
      - loki
    restart: unless-stopped
    networks:
      - obs-net

networks:
  obs-net:
    external: true
    name: "infra-automation-lab_obs-net"

volumes:
  # 2026-07-28: renamed from the generic "data" key -- see the matching note
  # in gitlab/docker-compose.yml for why this was necessary.
  loki_data:
    name: "infra-automation-lab_loki_data"

