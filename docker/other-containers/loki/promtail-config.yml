server:
  http_listen_port: 9080
  grpc_listen_port: 0

positions:
  filename: /tmp/positions.yaml

clients:
  - url: http://loki:3100/loki/api/v1/push

scrape_configs:
  - job_name: docker
    docker_sd_configs:
      - host: unix:///var/run/docker.sock
        refresh_interval: 15s
    relabel_configs:
      # Container name (Docker prefixes it with a leading "/") becomes the
      # "container" label; every container in this lab already carries the
      # com.unisystems.lab.* labels (see any docker-compose.yml here), which
      # Promtail's Docker service discovery exposes automatically as
      # __meta_docker_container_label_* -- reused below instead of inventing
      # a parallel labeling scheme.
      - source_labels: ["__meta_docker_container_name"]
        regex: "/(.*)"
        target_label: "container"
      - source_labels: ["__meta_docker_container_label_com_unisystems_lab_role"]
        target_label: "service"
      - source_labels: ["__meta_docker_container_label_com_unisystems_lab_scope"]
        target_label: "lab_scope"
