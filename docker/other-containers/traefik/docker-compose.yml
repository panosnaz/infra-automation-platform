---
services:
  traefik:
    labels:
      com.unisystems.lab.name: "infra-automation-lab"
      com.unisystems.lab.scope: "nautobot-infra-automation"
      com.unisystems.lab.role: "traefik"
    image: "traefik:v3.1"
    container_name: "infra-automation-lab-traefik"
    command:
      - "--providers.file.filename=/etc/traefik/dynamic.yml"
      - "--providers.file.watch=true"
      - "--entrypoints.web.address=:80"
      - "--api.dashboard=true"
      - "--api.insecure=true"
    ports:
      - "8090:80"
      - "8091:8080"
    volumes:
      - "./dynamic.yml:/etc/traefik/dynamic.yml:ro"
    extra_hosts:
      - "host.docker.internal:host-gateway"
    restart: unless-stopped

