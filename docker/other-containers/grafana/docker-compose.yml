---
services:
  grafana:
    labels:
      com.unisystems.lab.name: "infra-automation-lab"
      com.unisystems.lab.scope: "nautobot-infra-automation"
      com.unisystems.lab.role: "grafana"
    image: "grafana/grafana:latest"
    container_name: "infra-automation-lab-grafana"
    ports:
      - "3000:3000"
    environment:
      GF_SECURITY_ADMIN_USER: "admin"
      GF_SECURITY_ADMIN_PASSWORD: "${GRAFANA_ADMIN_PASSWORD:?Set GRAFANA_ADMIN_PASSWORD in the environment before starting this stack}"
    volumes:
      - "./provisioning:/etc/grafana/provisioning:ro"
      - "data:/var/lib/grafana"
    extra_hosts:
      - "host.docker.internal:host-gateway"
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:3000/api/health"]
      interval: "15s"
      timeout: "5s"
      start_period: "15s"
      retries: 5
    restart: unless-stopped

volumes:
  data:
    name: "infra-automation-lab_grafana_data"
