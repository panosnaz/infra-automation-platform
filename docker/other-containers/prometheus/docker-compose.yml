---
services:
  prometheus:
    labels:
      com.unisystems.lab.name: "infra-automation-lab"
      com.unisystems.lab.scope: "nautobot-infra-automation"
      com.unisystems.lab.role: "prometheus"
    image: "prom/prometheus:latest"
    container_name: "infra-automation-lab-prometheus"
    ports:
      - "9090:9090"
    volumes:
      - "./prometheus.yml:/etc/prometheus/prometheus.yml:ro"
      - "data:/prometheus"
    extra_hosts:
      - "host.docker.internal:host-gateway"
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:9090/-/healthy"]
      interval: "15s"
      timeout: "5s"
      start_period: "15s"
      retries: 5
    restart: unless-stopped

volumes:
  data:
    name: "infra-automation-lab_prometheus_data"
