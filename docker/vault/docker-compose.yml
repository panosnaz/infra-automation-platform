---
services:
  vault:
    labels:
      com.unisystems.lab.name: "infra-automation-lab"
      com.unisystems.lab.scope: "nautobot-infra-automation"
      com.unisystems.lab.role: "vault"
    image: "hashicorp/vault:1.17"
    container_name: "infra-automation-lab-vault"
    ports:
      - "8200:8200"
    cap_add:
      - IPC_LOCK
    environment:
      VAULT_ADDR: "http://127.0.0.1:8200"
    volumes:
      - "vault_data:/vault/data"
      - "./config:/vault/config:ro"
      - "./init:/vault/init:ro"
      - "./state:/vault/state"
    entrypoint: ["sh", "/vault/init/entrypoint.sh"]
    healthcheck:
      test: ["CMD", "vault", "status"]
      interval: "10s"
      timeout: "5s"
      start_period: "90s"
      retries: 10
    restart: unless-stopped
    networks:
      - isolated-net

volumes:
  vault_data:
    name: "infra-automation-lab_vault_data"

networks:
  # Joins the standalone nautobot-isolated stack's network (not app-net) --
  # the root docker-compose.yml's app-net/full stack isn't up in this
  # workspace. Keep this on the isolated Nautobot network so local CI jobs can
  # this runs as part of the full stack.
  isolated-net:
    external: true
    name: "infra-automation-nautobot-isolated-net"
