---
services:
  mcp-server:
    labels:
      com.unisystems.lab.name: "infra-automation-lab"
      com.unisystems.lab.scope: "nautobot-infra-automation"
      com.unisystems.lab.role: "mcp-server"
    build:
      context: "../../mcp-server"
      dockerfile: "../docker/mcp-server/Dockerfile"
    image: "infra-automation-lab/mcp-server:local"
    container_name: "infra-automation-lab-mcp-server"
    ports:
      - "8071:8071"
    environment:
      NAUTOBOT_URL: "http://host.docker.internal:8080"
      NAUTOBOT_TOKEN: "${NAUTOBOT_TOKEN:?Set NAUTOBOT_TOKEN in the environment before starting this stack (same dev token every other lab service uses)}"
      GITLAB_URL: "http://host.docker.internal:8929"
      GITLAB_TOKEN: "${MCP_GITLAB_TOKEN:?Set MCP_GITLAB_TOKEN -- a dedicated read_api project access token, e.g. mcp-server-status-reader (see knowledge/architecture/Execution-Framework.md Milestone 5), never the root PAT}"
      GITLAB_PROJECT_ID: "1"
      MCP_API_KEY: "${MCP_API_KEY:-}"
      MCP_TRANSPORT: "streamable-http"
      MCP_HOST: "0.0.0.0"
      MCP_PORT: "8071"
      LOG_LEVEL: "INFO"
    extra_hosts:
      - "host.docker.internal:host-gateway"
    healthcheck:
      test: ["CMD", "python3", "-c", "import httpx; httpx.get('http://localhost:8071/health', timeout=3).raise_for_status()"]
      interval: "15s"
      timeout: "5s"
      retries: 3
      start_period: "10s"
