---
services:
  platform-api:
    labels:
      com.unisystems.lab.name: "infra-automation-lab"
      com.unisystems.lab.scope: "nautobot-infra-automation"
      com.unisystems.lab.role: "platform-api"
    build:
      context: "."
      dockerfile: "Dockerfile"
      additional_contexts:
        canonical_intent_src: "../../../platform/canonical_intent"
    image: "infra-automation-lab/platform-api:local"
    container_name: "infra-automation-lab-platform-api"
    ports:
      - "8000:8000"
    environment:
      # Docker Desktop resolves host.docker.internal on all platforms (Windows,
      # macOS, and Linux via the extra_hosts entry below), letting this
      # container reach the Nautobot and Vault stacks exposed on the host.
      VAULT_ADDR: "http://host.docker.internal:8200"
      NAUTOBOT_URL: "http://host.docker.internal:8080"
      NAUTOBOT_TOKEN: "${NAUTOBOT_TOKEN:?Set NAUTOBOT_TOKEN in the environment before starting this stack (see lab/README.md)}"
      OPA_URL: "http://opa:8181"
      AUDIT_LOG_PATH: "/app/data/policy_denials.jsonl"
      EXECUTION_STORE_PATH: "/app/data/execution_store.db"
      KNOWLEDGE_CAPTURE_PATH: "/app/data/knowledge/deployments.jsonl"
    volumes:
      - "./data:/app/data"
    depends_on:
      - opa
    extra_hosts:
      - "host.docker.internal:host-gateway"
    healthcheck:
      test: ["CMD", "python", "-c", "import httpx; httpx.get('http://localhost:8000/health', timeout=2).raise_for_status()"]
      interval: "10s"
      timeout: "5s"
      start_period: "10s"
      retries: 5
    restart: unless-stopped

  opa:
    labels:
      com.unisystems.lab.name: "infra-automation-lab"
      com.unisystems.lab.scope: "nautobot-infra-automation"
      com.unisystems.lab.role: "opa"
    image: "openpolicyagent/opa:latest"
    container_name: "infra-automation-lab-opa"
    command: ["run", "--server", "--addr=0.0.0.0:8181", "/policy"]
    volumes:
      - "./policy:/policy:ro"
    # No healthcheck: the official OPA image has no shell, wget, or curl to
    # run one with (confirmed by inspection, 2026-07-06). depends_on below
    # only waits for the container to start, not for OPA to be ready to
    # serve — technical_policy.py already fails closed on an unready OPA,
    # so this is a correctness non-issue, not a gap silently accepted.
    restart: unless-stopped

