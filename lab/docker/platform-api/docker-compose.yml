---
services:
  platform-api:
    labels:
      com.unisystems.lab.name: "infra-automation-lab"
      com.unisystems.lab.scope: "nautobot-infra-automation"
      com.unisystems.lab.role: "platform-api"
    build:
      context: "."
      dockerfile: "Dockerfile"
    image: "infra-automation-lab/platform-api:local"
    container_name: "infra-automation-lab-platform-api"
    ports:
      - "8000:8000"
    environment:
      # Docker Desktop resolves host.docker.internal on all platforms (Windows,
      # macOS, and Linux via the extra_hosts entry below), letting this
      # container reach the Nautobot and Vault stacks exposed on the host.
      VAULT_ADDR: "http://host.docker.internal:8200"
      NAUTOBOT_URL: "http://host.docker.internal:8080"
    extra_hosts:
      - "host.docker.internal:host-gateway"
    healthcheck:
      test: ["CMD", "python", "-c", "import httpx; httpx.get('http://localhost:8000/health', timeout=2).raise_for_status()"]
      interval: "10s"
      timeout: "5s"
      start_period: "10s"
      retries: 5
    restart: unless-stopped
