[project]
name = "mcp-server"
version = "0.1.0"
description = "MCP Server for the Network Platform Engineering Platform -- Milestone 5 (Execution Framework). Per ADR-018, tools write structured objects directly to Nautobot; there is no shared CanonicalIntent envelope."
requires-python = ">=3.11"
dependencies = [
    "mcp>=1.0.0",
    "pynautobot>=2.4.0",
    "python-gitlab>=4.4.0",
    "pydantic>=2.6.0",
    "pydantic-settings>=2.2.0",
    "httpx>=0.27.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "pytest-asyncio>=0.23.0",
]

[tool.setuptools.packages.find]
where = ["src"]
